[project]
name = "stagehome-api"
version = "0.1.0"
description = "StageHome backend — Python/FastAPI port of the original NestJS API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "authlib>=1.3.2",
    "httpx>=0.27.0",
    "pyotp>=2.9.0",
    "redis>=5.0.8",
    "celery[redis]>=5.4.0",
    "python-multipart>=0.0.9",
    "sentry-sdk[fastapi]>=2.13.0",
    "slowapi>=0.1.9",
    "geoalchemy2>=0.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
