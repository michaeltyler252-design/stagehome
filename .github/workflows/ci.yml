name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: shm_test
          POSTGRES_PASSWORD: shm_test
          POSTGRES_DB: shm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://shm_test:shm_test@localhost:5432/shm_test

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://shm_test:shm_test@localhost:5432/shm_test
          REDIS_URL: redis://localhost:6379
