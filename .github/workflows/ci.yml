name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: shm_test
          POSTGRES_PASSWORD: shm_test
          POSTGRES_DB: shm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api-py

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api-py/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest app/tests/ -v
        env:
          DATABASE_URL: postgresql://shm_test:shm_test@localhost:5432/shm_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          WEB_APP_ORIGIN: http://localhost:3000
          NODE_ENV: development

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-laravel
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: PHP syntax check (every file)
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l

      # Composer install/PHPUnit are intentionally not run here yet — see
      # apps/web-laravel/MIGRATION_LARAVEL.md. GitHub Actions runners have
      # normal internet access (unlike the sandbox that built this repo),
      # so `composer install && php artisan test` should work here once
      # this repo has a real composer.lock — add that as a follow-up once
      # the project has been installed for real at least once.
