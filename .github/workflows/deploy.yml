name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# This workflow requires the following GitHub repository secrets before it
# can run for real (none are guessed or fabricated here):
#   REGISTRY_USERNAME, REGISTRY_PASSWORD   — container registry credentials
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID — for apps/web
#   Plus whatever your chosen host (Render/Railway/Fly.io/ECS) needs for
#   apps/api and apps/worker — intentionally not assumed, since Part D lists
#   several acceptable hosts rather than mandating one.

jobs:
  test-before-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: shm_ci
          POSTGRES_PASSWORD: shm_ci
          POSTGRES_DB: shm_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://shm_ci:shm_ci@localhost:5432/shm_ci
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://shm_ci:shm_ci@localhost:5432/shm_ci
          REDIS_URL: redis://localhost:6379

  build-and-push-images:
    needs: test-before-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }},ghcr.io/${{ github.repository }}/api:latest
      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/worker:${{ github.sha }},ghcr.io/${{ github.repository }}/worker:latest

  deploy-web:
    needs: test-before-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Deploying the built api/worker images to your chosen host (Render,
  # Railway, Fly.io, or ECS) is intentionally left as a follow-up step here
  # — each host's deploy action needs its own secrets and is a real decision
  # for whoever runs this, not something to guess on their behalf.
