name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# This workflow requires the following GitHub repository secrets before it
# can run for real (none are guessed or fabricated here):
#   REGISTRY_USERNAME, REGISTRY_PASSWORD — container registry credentials,
#     for the FastAPI backend image (apps/api-py)
#   Plus whatever your chosen host (Railway/Render/Fly.io/ECS) needs for
#     the backend — intentionally not assumed.
#   Laravel frontend hosting (apps/web-laravel) is NOT wired up here at
#   all yet — see apps/web-laravel/MIGRATION_LARAVEL.md for why: this repo
#   has never been through `composer install` for real (the sandbox that
#   built it has no Packagist access), so there's no verified deployment
#   artifact to push yet. Wire this job up once that's been done for real
#   on a machine with normal internet access.

jobs:
  test-before-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: shm_ci
          POSTGRES_PASSWORD: shm_ci
          POSTGRES_DB: shm_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: apps/api-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api-py/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest app/tests/ -v
        env:
          DATABASE_URL: postgresql://shm_ci:shm_ci@localhost:5432/shm_ci
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          WEB_APP_ORIGIN: http://localhost:3000
          NODE_ENV: development

  build-and-push-api-image:
    needs: test-before-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api-py/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }},ghcr.io/${{ github.repository }}/api:latest

  # Deploying the built API image to your chosen host (Railway, Render,
  # Fly.io, or ECS) is intentionally left as a follow-up step here — each
  # host's deploy action needs its own secrets and is a real decision for
  # whoever runs this, not something to guess on their behalf. See
  # railway.json at the repo root for the Railway-specific config this
  # project already has ready to go.
  #
  # Laravel frontend deployment: not wired up — see the note at the top
  # of this file.
