name: student-housing-marketplace

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: shm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shm_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-shm_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shm_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shm-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme_dev_only}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - shm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_dev_only}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shm_postgres_data:
  shm_redis_data:
